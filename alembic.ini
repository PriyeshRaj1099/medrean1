# Alembic configuration for MediLens AI.
#
# The database URL is NOT set here: database/migrations/env.py reads it from
# the application settings (DATABASE_URL env var / .env file) so migrations
# always target the same database as the running app. For a one-off override:
#
#   alembic -x db_url="postgresql+asyncpg://user:pass@host/db" upgrade head

[alembic]
script_location = database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
